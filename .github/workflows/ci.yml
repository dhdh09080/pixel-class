name: Pixel Class checks
on:
  pull_request:
  push:
    branches:
      [main, feature/pixel-class-v02, feature/classroom-teaching-day, deploy/railway-private-test]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build persistent server image
        run: docker build -t pixel-class:ops-test .
      - name: Verify private HTTPS container and real accounts
        run: npm run test:operations
      - name: Verify Railway volume guards and private HTTPS accounts
        run: npm run test:railway
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: write
    concurrency:
      group: railway-verified-branch
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.promotion.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish only the verified current main commit
        id: promotion
        run: node scripts/promote-railway.mjs
