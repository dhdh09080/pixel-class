name: Pixel Class checks
on:
  pull_request:
  push:
    branches: [main, feature/pixel-class-v02, feature/pixel-class-v03]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build persistent server image
        run: docker build -t pixel-class:ops-test .
      - name: Verify private HTTPS container and real accounts
        run: npm run test:operations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
